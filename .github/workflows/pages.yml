name: Publish site

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # runs code/*.py before rendering (scripts/uitvoer_boekje.py) to produce
      # the "Uitvoer in het boekje" text; the booklet codes need only the stdlib
      - uses: actions/setup-python@v7
        with:
          python-version: "3.14"

      - uses: quarto-dev/quarto-actions/setup@v2
        with:
          version: 1.10.19

      - run: quarto render

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
